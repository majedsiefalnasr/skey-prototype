    <div class="customer-overlay fixed [inset:0] [z-index:180] hidden items-center justify-center [padding:24px] [background:var(--scrim)]" id="geo-hierarchy-scrim">

        aria-modal="true"
        aria-label="Location hierarchy">

    <div class="customer-overlay fixed [inset:0] [z-index:180] hidden items-center justify-center [padding:24px] [background:var(--scrim)]" id="geo-parent-picker-scrim">
      <section
        class="customer-modal geo-parent-picker-modal max-w-[620px]"
        role="dialog"
        aria-modal="true"
        aria-labelledby="geo-parent-picker-title">
        <header class="customer-modal-header">
          <div>
            <h3 id="geo-parent-picker-title">Choose parent location</h3>
            <p>Pick a location from the hierarchy, or clear it to make this a root location.</p>
          </div>
          <button
            class="ibtn geo-parent-picker-close ms-auto"
            type="button"
            aria-label="Close parent location picker">
            <svg width="15" height="15" aria-hidden="true"><use href="#i-x" /></svg>
          </button>
        </header>
        <div class="customer-modal-body">
          <div
            class="geo-view-switch grid grid-cols-2 gap-[3px] p-[3px] rounded-[7px] bg-[var(--line-2)] [margin:8px_8px_0]"
            role="tablist"
            aria-label="Parent picker view">
            <button
              type="button"
              role="tab"
              data-geo-parent-picker-view="tree"
              aria-selected="true"
              aria-controls="geo-parent-picker-tree-pane"
              class="inline-flex min-h-8 gap-[7px] items-center justify-center px-[9px] py-[5px] rounded-[5px] text-muted text-[12.5px] font-semibold">
              <svg width="15" height="15" aria-hidden="true"><use href="#i-flow" /></svg>
              Tree

            <button
              type="button"
              role="tab"
              data-geo-parent-picker-view="flow"
              aria-selected="false"
              aria-controls="geo-parent-picker-flow-pane"
              class="inline-flex min-h-8 gap-[7px] items-center justify-center px-[9px] py-[5px] rounded-[5px] text-muted text-[12.5px] font-semibold">
              <svg width="15" height="15" aria-hidden="true"><use href="#i-grid" /></svg>
              Flow
            </button>
          </div>
          <button class="lbtn out geo-parent-picker-root my-[10px]" type="button">
            No parent (root location)
          </button>
          <div id="geo-parent-picker-tree-pane" role="tabpanel">
            <div
              class="geo-tree geo-parent-picker-tree min-h-0 flex-1 pt-0 px-2 pb-[10px] overflow-auto max-h-[360px]"
              id="geo-parent-picker-tree"
              role="tree"
              aria-label="Locations"></div>
          </div>
          <div id="geo-parent-picker-flow-pane" role="tabpanel" hidden>
            <div
              class="geo-flow-viewport geo-parent-picker-flow-viewport min-w-0 flex-1 mx-2 mb-2 overflow-auto cursor-grab rounded-[7px] border border-line touch-none select-none min-h-[360px] [background-color:var(--bg)] [background-image:radial-gradient(var(--line)_1px,transparent_1px)] [background-size:16px_16px]"

              <div class="geo-flow-canvas relative min-w-full min-h-full [max-height:min(560px,80vh)]" id="geo-parent-picker-flow-canvas"></div>
            </div>
          </div>
        </div>
      </section>
