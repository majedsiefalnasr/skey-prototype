<template class="events-tpl">
  <div class="events-view collab-view flex min-h-0 flex-1 flex-col" hidden>
    <div class="phead flex items-start gap-5 px-4 [.d1_&]:[padding:11px_0]">
      <div class="l min-w-0 flex-1">
        <nav class="flex items-center gap-1.5 text-[13px] text-muted [&_a]:text-accent [&_a]:no-underline [&_a:hover]:underline" aria-label="Breadcrumb">
          <a href="#" data-collab-home data-i18n="Help Screens">Help Screens</a><span aria-hidden="true">›</span
          ><span aria-current="page" data-i18n="Events">Events</span>
        </nav>
        <div class="mt-2"><h1 class="text-[23px] font-semibold leading-tight text-ink [body.density-compact_&]:text-[20px]" data-i18n="Events">Events</h1></div>
        <p class="mt-0.5 text-[13px] text-muted" data-i18n="Meetings, holidays and other time on the calendar.">Meetings, holidays and other time on the calendar.</p>
      </div>
      <div class="r">
        <button type="button" class="lbtn pri" data-collab-new>
          <svg width="15" height="15" aria-hidden="true"><use href="#i-plus" /></svg>
          <span data-i18n="New event">New event</span>
        </button>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2 pb-2 pt-3 [@media(max-width:900px)]:px-2" data-collab-toolbar></div>
    <div class="min-h-0 flex-1 overflow-auto pb-4 [@media(max-width:900px)]:mx-2 max-[720px]:pb-[calc(1rem+var(--flag-reserve,0px))]" data-collab-body></div>
  </div>
</template>
