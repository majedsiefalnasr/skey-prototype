<template class="profile-tpl">
  <div
    class="profile-view [&:not([hidden])]:flex [&:not([hidden])]:[flex:1] [&:not([hidden])]:min-h-0 [&:not([hidden])]:flex-col"
    data-settings-navigation-style="sidebar"
    hidden>
    <div class="phead [.d1_&]:[padding:11px_0] [.d1_&]:flex [.d1_&]:items-start [.d1_&]:gap-5">
      <div class="l [.d1_.phead_&]:[flex:1]">
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="#" data-i18n="Home">Home</a><span class="sep">›</span
          ><span aria-current="page" data-i18n="Profile">Profile</span>
        </nav>
        <div
          class="tline [.d1_&]:flex [.d1_&]:items-center [.d1_&]:gap-5 [.d1_&]:mt-2! [.d1_&]:flex-wrap [.d1_&_h1]:[font-size:23px] [.d1_&_h1]:font-semibold">
          <h1 data-i18n="Profile">Profile</h1>
        </div>
      </div>
    </div>
    <div
      class="canvas profile-canvas [flex:1] min-h-0 overflow-auto text-start"
      id="profile-canvas">
      <div

        <div class="profile-scroll-content min-w-0" id="profile-scroll-content"></div>
