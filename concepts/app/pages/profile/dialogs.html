<!-- ===== Change password dialog ===== -->
<div
  class="dscrim fixed [inset:0] [background:rgba(17,_24,_39,_0.45)] [z-index:130] hidden items-center justify-center [padding:24px]"
  id="change-password-scrim">
  <div
    class="dlg [width:min(420px,_96vw)] rounded-xl overflow-hidden flex flex-col [max-height:90vh]"
    data-tone="default"
    role="dialog"
    aria-modal="true"
    aria-labelledby="change-password-title">
    <div class="dhd flex items-start gap-5 [&_h3]:[font-size:15px]">
      <svg width="18" height="18" aria-hidden="true" class="[margin-top:2px]">
        <use href="#i-lock" />
      </svg>
      <div>
        <h3 id="change-password-title">Change password</h3>
        <p class="dhd-subtitle">Use a strong password you don't reuse elsewhere</p>
      </div>
      <button class="ibtn c-close" aria-label="Close" style="margin-inline-start: auto">
        <svg width="15" height="15" aria-hidden="true"><use href="#i-x" /></svg>
      </button>
    </div>
    <form class="dlg-inner min-h-0 [padding:16px]" id="change-password-form" novalidate>
      <div class="dbody flex flex-col gap-5 [padding:16px_18px] overflow-auto">
        <label class="grid gap-1.5 text-[13px] font-semibold" for="current-password">
          Current password
          <input
            class="w-full min-h-[32px] rounded-[7px] border border-line bg-surface px-[9px] py-1.5 font-[inherit] text-[14px] text-ink"
            id="current-password"
            type="password"
            required
            autocomplete="current-password" />
        </label>
        <label class="grid gap-1.5 text-[13px] font-semibold" for="new-password">
          New password
          <input
            class="w-full min-h-[32px] rounded-[7px] border border-line bg-surface px-[9px] py-1.5 font-[inherit] text-[14px] text-ink"
            id="new-password"
            type="password"
            required
            minlength="8"
            autocomplete="new-password" />
        </label>
        <label class="grid gap-1.5 text-[13px] font-semibold" for="confirm-password">
          Confirm new password
          <input
            class="w-full min-h-[32px] rounded-[7px] border border-line bg-surface px-[9px] py-1.5 font-[inherit] text-[14px] text-ink"
            id="confirm-password"
            type="password"
            required
            autocomplete="new-password" />
        </label>
        <span
          class="[font-size:11px] [line-height:1.35] [color:var(--danger)] [&:empty]:hidden"
          id="change-password-error"
          role="status"></span>
      </div>
      <div class="dfoot [padding:12px_18px] flex justify-end gap-2">
        <button type="button" class="lbtn out c-close">Cancel</button>
        <button type="submit" class="lbtn pri">Change password</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== Set / change PIN dialog ===== -->
<div
  class="dscrim fixed [inset:0] [background:rgba(17,_24,_39,_0.45)] [z-index:130] hidden items-center justify-center [padding:24px]"
  id="set-pin-scrim">
  <div
    class="dlg [width:min(420px,_96vw)] rounded-xl overflow-hidden flex flex-col [max-height:90vh]"
    data-tone="default"
    role="dialog"
    aria-modal="true"
    aria-labelledby="set-pin-title">
    <div class="dhd flex items-start gap-5 [&_h3]:[font-size:15px]">
      <svg width="18" height="18" aria-hidden="true" class="[margin-top:2px]">
        <use href="#i-lock" />
      </svg>
      <div>
        <h3 id="set-pin-title">Set / change PIN code</h3>
        <p class="dhd-subtitle">Used for quick sign-in on this device</p>
      </div>
      <button class="ibtn c-close" aria-label="Close" style="margin-inline-start: auto">
        <svg width="15" height="15" aria-hidden="true"><use href="#i-x" /></svg>
      </button>
    </div>
    <form class="dlg-inner min-h-0 [padding:16px]" id="set-pin-form" novalidate>
      <div class="dbody flex flex-col gap-5 [padding:16px_18px] overflow-auto">
        <label class="grid gap-1.5 text-[13px] font-semibold" for="current-pin">
          Current PIN (leave blank if none set)
          <input
            class="w-full min-h-[32px] rounded-[7px] border border-line bg-surface px-[9px] py-1.5 font-[inherit] text-[14px] text-ink [font-variant-numeric:tabular-nums]"
            id="current-pin"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            autocomplete="off" />
        </label>
        <label class="grid gap-1.5 text-[13px] font-semibold" for="new-pin">
          New PIN (4–6 digits)
          <input
            class="w-full min-h-[32px] rounded-[7px] border border-line bg-surface px-[9px] py-1.5 font-[inherit] text-[14px] text-ink [font-variant-numeric:tabular-nums]"
            id="new-pin"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            minlength="4"
            maxlength="6"
            required
            autocomplete="off" />
        </label>
        <label class="grid gap-1.5 text-[13px] font-semibold" for="confirm-pin">
          Confirm new PIN
          <input
            class="w-full min-h-[32px] rounded-[7px] border border-line bg-surface px-[9px] py-1.5 font-[inherit] text-[14px] text-ink [font-variant-numeric:tabular-nums]"
            id="confirm-pin"
            type="password"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            required
            autocomplete="off" />
        </label>
        <span
          class="[font-size:11px] [line-height:1.35] [color:var(--danger)] [&:empty]:hidden"
          id="set-pin-error"
          role="status"></span>
      </div>
      <div class="dfoot [padding:12px_18px] flex justify-end gap-2">
        <button type="button" class="lbtn out c-close">Cancel</button>
        <button type="submit" class="lbtn pri">Save PIN</button>
      </div>
    </form>
  </div>
</div>
