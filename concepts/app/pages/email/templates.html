      <template class="email-tpl">
        <div class="email-view flex flex-1 min-h-0 flex-col" hidden>
          <div class="phead email-phead [.d1_&]:[padding:11px_0] [.d1_&]:flex [.d1_&]:items-start [.d1_&]:gap-5 px-4">
              <div class="l [.d1_.phead_&]:flex-1">
              <nav class="crumbs" aria-label="Breadcrumb">
          <a href="/" data-home-link data-i18n="Home">Home</a><span class="sep" aria-hidden="true">›</span>
                <a href="#" class="email-back" data-i18n="Help Screens">Help Screens</a><span class="sep">›</span
                ><span aria-current="page" data-i18n="Internal Mail">Internal Mail</span>
              </nav>
              <div class="mt-2"><h1 class="text-[23px]! font-semibold leading-tight text-ink [body.density-compact_&]:text-[20px]!" data-i18n="Internal Mail">Internal Mail</h1></div>
            </div>
            <div class="r [.d1_.phead_&]:flex [.d1_.phead_&]:items-center [.d1_.phead_&]:gap-1 [.d1_.phead_&]:mt-1.5!">
              <button type="button" class="lbtn pri email-compose">
                <svg width="15" height="15" aria-hidden="true"><use href="#i-plus" /></svg> <span data-i18n="Compose">Compose</span>
              </button>
            </div>
          </div>
          <div class="email-app my-3 [@media(max-width:900px)]:my-2 [body.density-compact_&]:my-1.5 [body.density-comfortable_&]:my-5 [@media(max-width:900px)]:mx-2 flex-1 min-h-[500px] flex rounded-[9px] border border-line overflow-hidden bg-surface">
            <nav class="email-folders flex-none border-e border-line" aria-label="Mailboxes" data-folders></nav>
            <div class="email-list w-[300px] flex-none flex flex-col min-h-0 border-e border-line">
              <label class="sr-only" for="email-folder-select" data-i18n="Mailbox">Mailbox</label>
              <select id="email-folder-select" class="mx-2.5 mt-2.5 min-h-8 rounded-md border border-line bg-surface px-2 text-[13px] text-ink" data-folder-select hidden></select>
              <div class="email-list-title mx-2.5 mt-2.5 mb-0 flex items-center gap-1.5 px-0.5 [body.density-compact_&]:mx-2 [body.density-compact_&]:mt-2 [body.density-comfortable_&]:mx-3 [body.density-comfortable_&]:mt-3">
                <button type="button" class="ibtn flex-none" data-rail-toggle aria-expanded="false" aria-controls="email-folder-list" aria-label="Expand mailboxes" title="Expand mailboxes">
                  <svg width="16" height="16" aria-hidden="true"><use href="#i-panel" /></svg>
                </button>
                <span class="min-w-0 flex-1 truncate font-[inherit] text-[15px] font-semibold text-ink" data-mail-folder-title dir="auto" data-i18n="Inbox">Inbox</span>
                <span class="inline-flex flex-none items-center rounded-full bg-[var(--accent-soft)] px-1.5 py-0.5 text-[11px] font-semibold text-accent" data-mail-folder-count hidden></span>
              </div>
              <div class="email-list-hd flex items-center gap-1.5 m-2.5 mb-0 [body.density-compact_&]:m-2 [body.density-compact_&]:mb-0 [body.density-comfortable_&]:m-3 [body.density-comfortable_&]:mb-0">
                <div class="email-search min-w-0 flex-1 flex items-center gap-[7px] py-[7px] px-[9px] rounded-[7px] border border-line text-faint [body.density-compact_&]:gap-1.5 [body.density-compact_&]:py-[5px] [body.density-compact_&]:px-[7px] [body.density-comfortable_&]:gap-2 [body.density-comfortable_&]:py-[9px] [body.density-comfortable_&]:px-[11px]">
                  <svg width="13" height="13" aria-hidden="true"><use href="#i-search" /></svg>
                  <input
                    type="search"
                    id="email-search-input"
                    placeholder="Search this mailbox…" data-i18n-placeholder="Search this mailbox…"
                    aria-label="Search this mailbox" data-i18n-aria-label="Search this mailbox"
                    autocomplete="off"
                    class="border-0 outline-none bg-transparent font-[inherit] text-ink flex-1 min-w-0 p-0 placeholder:text-faint" />
                </div>
                <button type="button" class="ibtn relative flex-none" data-mail-filters aria-label="Search filters" aria-haspopup="dialog" title="Search filters">
                  <svg width="16" height="16" aria-hidden="true"><use href="#i-filter" /></svg>
                  <span class="absolute -top-1 -end-1 min-w-4 rounded-full bg-accent px-1 text-center text-[10px] font-semibold text-inverse" data-mail-filter-count hidden></span>
                </button>
              </div>
              <div class="fixed inset-0 z-[180] hidden items-center justify-center p-3 [background:var(--scrim)] backdrop-blur-[4px]" data-mail-filter-dialog>
                <form class="dlg flex max-h-[90vh] w-[min(520px,96vw)] flex-col overflow-hidden rounded-xl" data-tone="default" role="dialog" aria-modal="true" aria-labelledby="mail-filter-title" novalidate>
                  <div class="dhd flex items-start gap-5"><div><h3 id="mail-filter-title" data-i18n="Search filters">Search filters</h3><p class="dhd-subtitle" data-i18n="Choose which messages to show.">Choose which messages to show.</p></div><button type="button" class="ibtn ms-auto" data-mail-filter-cancel aria-label="Close filters"><svg width="15" height="15" aria-hidden="true"><use href="#i-x" /></svg></button></div>
                  <div class="dlg-inner min-h-0 overflow-auto"><div class="dbody grid gap-3 p-5 text-[13px]">
                  <label class="flex items-center gap-2"><input type="checkbox" data-mail-filter="all"> <span data-i18n="All mail except Trash">All mail except Trash</span></label>
                  <label><span data-i18n="Sender or recipient">Sender or recipient</span><input type="search" data-mail-filter="person" class="mt-1 w-full rounded border border-line bg-surface p-1.5 text-ink"></label>
                  <label><span data-i18n="From date">From date</span><input type="date" data-mail-filter="from" class="mt-1 w-full rounded border border-line bg-surface p-1.5 text-ink"></label>
                  <label><span data-i18n="To date">To date</span><input type="date" data-mail-filter="to" class="mt-1 w-full rounded border border-line bg-surface p-1.5 text-ink"></label>
                  <label class="flex items-center gap-2"><input type="checkbox" data-mail-filter="attachments"><span data-i18n="Has attachments">Has attachments</span></label>
                  <label class="flex items-center gap-2"><input type="checkbox" data-mail-filter="linked"><span data-i18n="Linked to a record">Linked to a record</span></label>
                  <p class="text-[var(--danger)]" role="alert" data-mail-filter-error></p>
                  </div></div>
                  <div class="dfoot flex flex-wrap items-center gap-2"><button type="button" class="lbtn" data-mail-reset-filters data-i18n="Clear filters">Clear filters</button><button type="button" class="lbtn ms-auto" data-mail-filter-cancel data-i18n="Cancel">Cancel</button><button type="submit" class="lbtn pri" data-mail-filter-apply data-i18n="Apply filters">Apply filters</button></div>
                </form>
              </div>
              <div class="mx-2.5 mt-1 flex flex-wrap gap-1 text-xs text-muted" aria-live="polite" data-mail-filter-chips></div>
              <div class="email-list-tools mx-2.5 mt-1.5 mb-0 grid gap-1 [body.density-compact_&]:mx-2 [body.density-comfortable_&]:mx-3">
                <div class="flex items-center justify-between gap-2 whitespace-nowrap">
                  <label class="flex min-h-[28px] cursor-pointer items-center gap-1.5 text-[12.5px] text-muted">
                    <span data-i18n="Select all">Select all</span>
                    <span class="relative inline-flex h-[17px] w-[30px] flex-none">
                      <input type="checkbox" role="switch" data-mail-select-all class="peer absolute inset-0 m-0 cursor-pointer opacity-0" />
                      <span class="pointer-events-none absolute inset-0 rounded-full bg-line transition-[background] duration-[120ms] before:absolute before:start-0.5 before:top-0.5 before:size-[13px] before:rounded-full before:bg-inverse before:transition-[translate] before:duration-[120ms] before:content-[''] peer-checked:bg-accent peer-checked:before:translate-x-[13px] peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-[var(--focus)] rtl:peer-checked:before:-translate-x-[13px]"></span>
                    </span>
                  </label>
                  <label class="flex min-h-[28px] cursor-pointer items-center gap-1.5 text-[12.5px] text-muted">
                    <span data-i18n="Unread only">Unread only</span>
                    <span class="relative inline-flex h-[17px] w-[30px] flex-none">
                      <input type="checkbox" role="switch" data-mail-unread-filter class="peer absolute inset-0 m-0 cursor-pointer opacity-0" />
                      <span class="pointer-events-none absolute inset-0 rounded-full bg-line transition-[background] duration-[120ms] before:absolute before:start-0.5 before:top-0.5 before:size-[13px] before:rounded-full before:bg-inverse before:transition-[translate] before:duration-[120ms] before:content-[''] peer-checked:bg-accent peer-checked:before:translate-x-[13px] peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-[var(--focus)] rtl:peer-checked:before:-translate-x-[13px]"></span>
                    </span>
                  </label>
                </div>
              </div>
              <div class="nc-scroll min-h-0 flex-1 overflow-auto" id="email-list-scroll"></div>
            </div>
            <div class="email-reading flex-1 min-w-0 flex flex-col min-h-0" id="email-reading"></div>
          </div>
        </div>
      </template>
