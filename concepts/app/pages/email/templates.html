      <template class="email-tpl">
        <div class="email-view flex flex-1 min-h-0 flex-col" hidden>
          <div class="phead email-phead [.d1_&]:[padding:11px_0] [.d1_&]:flex [.d1_&]:items-start [.d1_&]:gap-5 px-4">
              <div class="l [.d1_.phead_&]:flex-1">
              <nav class="crumbs" aria-label="Breadcrumb">
                <a href="#" class="email-back">Home</a><span class="sep">›</span
                ><span aria-current="page">Internal Mail</span>
              </nav>
              <div class="tline"><h1>Internal Mail</h1></div>
            </div>
            <div class="r">
              <button type="button" class="lbtn pri email-compose">
                <svg width="15" height="15" aria-hidden="true"><use href="#i-plus" /></svg> Compose
              </button>
            </div>
          </div>
          <div class="email-app flex-1 min-h-0 flex mx-4 my-3 rounded-[9px] border border-line overflow-hidden bg-surface [body.density-compact_&]:mx-3 [body.density-compact_&]:my-2 [body.density-comfortable_&]:mx-5 [body.density-comfortable_&]:my-4">
            <nav class="email-folders flex-none border-e border-line" aria-label="Mailboxes" data-folders></nav>
            <div class="email-list w-[300px] flex-none flex flex-col min-h-0 border-e border-line">
              <label class="sr-only" for="email-folder-select">Mailbox</label>
              <select id="email-folder-select" class="mx-2.5 mt-2.5 min-h-8 rounded-md border border-line bg-surface px-2 text-[13px] text-ink" data-folder-select hidden></select>
              <div class="email-list-title mx-2.5 mt-2.5 mb-0 flex items-center gap-2 rounded-[7px] border border-line bg-surface px-2.5 py-[7px] [body.density-compact_&]:mx-2 [body.density-compact_&]:mt-2 [body.density-compact_&]:py-[5px] [body.density-compact_&]:px-2 [body.density-comfortable_&]:mx-3 [body.density-comfortable_&]:mt-3 [body.density-comfortable_&]:py-[9px] [body.density-comfortable_&]:px-3">
                <span class="min-w-0 flex-1 truncate font-[inherit] text-[13px] font-semibold text-ink" data-mail-folder-title dir="auto">Inbox</span>
                <span class="flex-none text-[12px] text-faint" data-mail-folder-count></span>
              </div>
              <div class="email-list-hd flex items-center gap-1.5 m-2.5 mb-0 [body.density-compact_&]:m-2 [body.density-compact_&]:mb-0 [body.density-comfortable_&]:m-3 [body.density-comfortable_&]:mb-0">
                <button type="button" class="ibtn" data-rail-toggle aria-expanded="false" aria-controls="email-folder-list" aria-label="Expand mailboxes" title="Expand mailboxes">
                  <svg width="16" height="16" aria-hidden="true"><use href="#i-panel" /></svg>
                </button>
                <div class="email-search flex-1 flex items-center gap-[7px] py-[7px] px-[9px] rounded-[7px] border border-line text-faint [body.density-compact_&]:gap-1.5 [body.density-compact_&]:py-[5px] [body.density-compact_&]:px-[7px] [body.density-comfortable_&]:gap-2 [body.density-comfortable_&]:py-[9px] [body.density-comfortable_&]:px-[11px]">
                  <svg width="13" height="13" aria-hidden="true"><use href="#i-search" /></svg>
                  <input
                    type="search"
                    id="email-search-input"
                    placeholder="Search this mailbox…"
                    aria-label="Search this mailbox"
                    autocomplete="off"
                    class="border-0 outline-none bg-transparent font-[inherit] text-ink flex-1 min-w-0 p-0 placeholder:text-faint" />
                </div>
              </div>
              <div class="email-list-tools mx-2.5 mt-1.5 mb-0 flex items-center gap-1.5 [body.density-compact_&]:mx-2 [body.density-comfortable_&]:mx-3">
                <button type="button" class="ibtn aria-pressed:border-[var(--accent-line)] aria-pressed:bg-[var(--accent-soft)] aria-pressed:text-accent" data-mail-unread-filter aria-pressed="false" aria-label="Unread only" title="Unread only">
                  <svg width="16" height="16" aria-hidden="true"><use href="#i-mail" /></svg>
                </button>
                <input type="checkbox" data-mail-select-all aria-label="Select all messages" class="ms-0.5 size-3.5 flex-none cursor-pointer accent-[var(--accent)]" />
                <span class="ms-auto font-mono text-[12px] text-faint" data-mail-select-label></span>
              </div>
              <div class="nc-scroll min-h-0 flex-1 overflow-auto" id="email-list-scroll"></div>
            </div>
            <div class="email-reading flex-1 min-w-0 flex flex-col min-h-0" id="email-reading"></div>
          </div>
        </div>
      </template>
