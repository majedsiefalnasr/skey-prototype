    <!-- ===== unsaved-work guard ===== -->
    <div class="dscrim" id="gscrim">
      <div class="guard" role="dialog" aria-modal="true" aria-labelledby="g-title">
        <div class="gh">
          <svg width="17" height="17" style="color: var(--warn-ink)" aria-hidden="true">
            <use href="#i-clock" />
          </svg>
          <h3 id="g-title">You have unsaved work</h3>
        </div>
        <div class="gb">
          <span id="g-msg"
            >This invoice has changes that were never saved. Leaving now loses them.</span
          >
          <div class="lst" id="g-what"></div>
        </div>
        <div class="gf">
          <button class="lbtn out" id="g-discard">Leave without saving</button>
          <span class="end">
            <button class="lbtn out" id="g-newtab">
              <svg width="14" height="14" aria-hidden="true"><use href="#i-next" /></svg> Open in
              new tab
            </button>
            <button class="lbtn out" id="g-stay">Stay here</button>
            <button class="lbtn pri" id="g-save">Save, then leave</button>
          </span>
        </div>
      </div>
    </div>
