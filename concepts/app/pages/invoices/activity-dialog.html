<!-- ===== drawer ===== -->
<div
  class="drscrim fixed inset-0 z-[130] hidden bg-[rgba(17,24,39,0.4)] [&.open]:block"
  id="drscrim"></div>
<aside
  class="drawer fixed inset-y-0 end-0 z-[140] hidden w-[min(560px,94vw)] flex-col bg-surface shadow-shell [&.open]:flex"
  id="drawer"
  role="dialog"
  aria-modal="true"
  aria-label="Log and activity">
  <div class="drhd border-b border-line px-[18px] pb-0 pt-3.5">
    <div
      class="top flex items-start gap-5 [.d4_&]:flex [.d4_&]:items-center [.d4_&]:gap-5 [.d4_&]:[padding:9px_16px] [.d4_&]:bg-surface [.d4_&]:[border-bottom:1px_solid_var(--line)] [.d4_&]:flex-wrap">
      <div>
        <h3 class="flex items-center gap-2 text-[15px]">
          History of this invoice <span class="badge fix">proposal</span>
        </h3>
        <div
          class="sub mt-px text-xs text-muted [.stpop_.hd_&]:text-xs [.stpop_.hd_&]:text-muted [.dhd_&]:text-xs [.dhd_&]:text-muted">
          Sales Invoice 001000352026126 · العميل الاول — the Documents Flow side is a proposal; the
          system stores nothing for it yet
        </div>
      </div>
      <button
        class="ibtn dr-close relative inline-flex min-h-8 min-w-8 items-center justify-center gap-1.5 rounded-md px-2 py-1 hover:enabled:bg-[var(--line-2)] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--focus)] [.rec-adjustment-row_&]:[margin-bottom:1px]!"
        aria-label="Close"
        style="margin-inline-start: auto">
        <svg width="15" height="15" aria-hidden="true"><use href="#i-x" /></svg>
      </button>
    </div>
    <div class="drtabs mt-3 flex gap-[18px]" role="tablist">
      <button
        class="drtab flex items-center gap-[7px] border-b-2 border-transparent px-0.5 py-2 text-[13px] text-muted aria-selected:border-accent aria-selected:font-semibold aria-selected:text-accent"
        role="tab"
        aria-selected="true"
        data-tab="stages">
        User Log
        <span
          class="n rounded-full bg-[var(--line-2)] px-[7px] py-px text-xs text-muted [.drtab[aria-selected='true']_&]:bg-[var(--accent-soft)] [.drtab[aria-selected='true']_&]:text-accent [.d4_.cp-mini_&]:text-xs [.d4_.cp-mini_&]:font-semibold [.d4_.cp-mini.off_&]:text-muted [.d4_.cp-mini.off_&]:font-normal"
          >3</span
        >
      </button>
      <button
        class="drtab flex items-center gap-[7px] border-b-2 border-transparent px-0.5 py-2 text-[13px] text-muted aria-selected:border-accent aria-selected:font-semibold aria-selected:text-accent"
        role="tab"
        aria-selected="false"
        data-tab="activity">
        Documents Flow
        <span
          class="n rounded-full bg-[var(--line-2)] px-[7px] py-px text-xs text-muted [.drtab[aria-selected='true']_&]:bg-[var(--accent-soft)] [.drtab[aria-selected='true']_&]:text-accent [.d4_.cp-mini_&]:text-xs [.d4_.cp-mini_&]:font-semibold [.d4_.cp-mini.off_&]:text-muted [.d4_.cp-mini.off_&]:font-normal"
          >18</span
        >
      </button>
    </div>
  </div>
  <div
    class="drbar flex flex-wrap items-center gap-2.5 border-b border-line px-[18px] py-[9px] text-xs text-muted"
    data-for="stages">
    <span
      >What the system recorded, most recent state per card · now
      <b class="cur-name">Posted</b></span
    >
    <span
      class="end ms-auto flex items-center gap-2 [.rfoot_&]:ms-auto! [.rfoot_&]:flex [.rfoot_&]:gap-2 [.jbar_&]:ms-auto! [.guard_.gf_&]:ms-auto! [.guard_.gf_&]:flex [.guard_.gf_&]:flex-wrap [.guard_.gf_&]:justify-end [.guard_.gf_&]:gap-2.5 [.d2_.crow_&]:ms-auto! [.d2_.crow_&]:flex [.d2_.crow_&]:items-center [.d2_.crow_&]:gap-2 [.d3_.fbar_&]:ms-auto! [.d3_.fbar_&]:flex [.d3_.fbar_&]:gap-2 [.d4_.top_&]:ms-auto! [.d4_.top_&]:flex [.d4_.top_&]:items-center [.d4_.top_&]:gap-2"
      ><button
        class="lbtn out inline-flex items-center gap-1.5 rounded-md border border-line bg-surface px-[11px] py-1.5 font-medium whitespace-nowrap hover:enabled:bg-[var(--line-2)] disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--focus)]"
        style="font-size: 12px">
        <svg width="13" height="13" aria-hidden="true"><use href="#i-dl" /></svg> Export
      </button></span
    >
  </div>
  <div
    class="drbar flex flex-wrap items-center gap-2.5 border-b border-line px-[18px] py-[9px] text-xs text-muted"
    data-for="activity"
    hidden>
    <div
      class="segctl inline-flex overflow-hidden rounded-[7px] border border-line"
      role="group"
      aria-label="Filter">
      <button
        class="border-e border-line px-[11px] py-1 text-xs aria-pressed:bg-[var(--line-2)] aria-pressed:font-semibold aria-pressed:text-ink"
        aria-pressed="true">
        All</button
      ><button
        class="border-e border-line px-[11px] py-1 text-xs aria-pressed:bg-[var(--line-2)] aria-pressed:font-semibold aria-pressed:text-ink"
        aria-pressed="false">
        Comments
      </button>
      <button
        class="border-e border-line px-[11px] py-1 text-xs aria-pressed:bg-[var(--line-2)] aria-pressed:font-semibold aria-pressed:text-ink"
        aria-pressed="false">
        Changes</button
      ><button
        class="border-e-0 px-[11px] py-1 text-xs aria-pressed:bg-[var(--line-2)] aria-pressed:font-semibold aria-pressed:text-ink"
        aria-pressed="false">
        Documents
      </button>
    </div>
    <span
      class="end ms-auto flex items-center gap-2 [.rfoot_&]:ms-auto! [.rfoot_&]:flex [.rfoot_&]:gap-2 [.jbar_&]:ms-auto! [.guard_.gf_&]:ms-auto! [.guard_.gf_&]:flex [.guard_.gf_&]:flex-wrap [.guard_.gf_&]:justify-end [.guard_.gf_&]:gap-2.5 [.d2_.crow_&]:ms-auto! [.d2_.crow_&]:flex [.d2_.crow_&]:items-center [.d2_.crow_&]:gap-2 [.d3_.fbar_&]:ms-auto! [.d3_.fbar_&]:flex [.d3_.fbar_&]:gap-2 [.d4_.top_&]:ms-auto! [.d4_.top_&]:flex [.d4_.top_&]:items-center [.d4_.top_&]:gap-2"
      ><button
        class="lbtn out inline-flex items-center gap-1.5 rounded-md border border-line bg-surface px-[11px] py-1.5 font-medium whitespace-nowrap hover:enabled:bg-[var(--line-2)] disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--focus)]"
        style="font-size: 12px">
        Newest first
      </button></span
    >
  </div>
  <div class="drbody flex-1 overflow-auto">
    <div data-panel="stages"></div>
    <div data-panel="activity" hidden></div>
  </div>
  <div class="drfoot border-t border-line bg-surface px-[18px] py-3" data-for="activity" hidden>
    <div class="lbl mb-[7px] flex items-center gap-[7px] text-xs text-muted">
      Add a note while the invoice is
      <span
        class="badge ok cur-badge [.reqchip&]:[background:var(--st-post-bg)] [.reqchip&]:[color:var(--st-post-ink)]"
        >Posted</span
      >
    </div>
    <textarea
      class="min-h-[58px] w-full resize-y rounded-lg border border-line bg-surface px-[11px] py-[9px] font-[inherit] text-[13px] text-ink"
      placeholder="Say what happened, or what someone should do next"></textarea>
    <div class="row mt-[9px] flex items-center gap-5">
      <label
        style="font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center"
        ><input type="checkbox" /> Staff only — the customer never sees this</label
      >
      <button
        class="lbtn out inline-flex items-center gap-1.5 rounded-md border border-line bg-surface px-[11px] py-1.5 font-medium whitespace-nowrap hover:enabled:bg-[var(--line-2)] disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--focus)]"
        style="font-size: 12px">
        <svg width="13" height="13" aria-hidden="true"><use href="#i-clip" /></svg> Attach file
      </button>
      <span
        class="end ms-auto [.rfoot_&]:ms-auto! [.rfoot_&]:flex [.rfoot_&]:gap-2 [.jbar_&]:ms-auto! [.guard_.gf_&]:ms-auto! [.guard_.gf_&]:flex [.guard_.gf_&]:flex-wrap [.guard_.gf_&]:justify-end [.guard_.gf_&]:gap-2.5 [.d2_.crow_&]:ms-auto! [.d2_.crow_&]:flex [.d2_.crow_&]:items-center [.d2_.crow_&]:gap-2 [.d3_.fbar_&]:ms-auto! [.d3_.fbar_&]:flex [.d3_.fbar_&]:gap-2 [.d4_.top_&]:ms-auto! [.d4_.top_&]:flex [.d4_.top_&]:items-center [.d4_.top_&]:gap-2"
        ><button
          class="lbtn pri inline-flex items-center gap-1.5 rounded-md border border-transparent bg-accent px-[11px] py-1.5 font-medium text-inverse whitespace-nowrap hover:enabled:bg-[var(--accent-hover)] disabled:cursor-not-allowed disabled:opacity-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--focus)]">
          Add note
        </button></span
      >
    </div>
  </div>
</aside>
