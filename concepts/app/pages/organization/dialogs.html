<div
  class="dscrim fixed [inset:0] [background:var(--scrim)] backdrop-blur-[4px] [z-index:130] hidden items-center justify-center [padding:var(--ds-space-300)]"
  id="organization-session-dialog">
  <div
    class="dlg [width:min(400px,_96vw)] rounded-xl overflow-hidden flex flex-col [max-height:90vh]"
    data-tone="danger"
    role="dialog"
    aria-modal="true"
    aria-labelledby="organization-session-title"
    aria-describedby="organization-session-description">
    <div class="dhd flex items-start gap-3 [&_h3]:[font-size:15px]">
      <svg width="18" height="18" aria-hidden="true" class="mt-0.5 text-[var(--danger)]">
        <use href="#i-lock" />
      </svg>
      <div>
        <h3 id="organization-session-title">Revoke session</h3>
        <p class="dhd-subtitle" id="organization-session-description">
          This immediately ends access for the selected session.
        </p>
      </div>
      <button type="button" class="ibtn c-close ms-auto" aria-label="Close">
        <svg width="15" height="15" aria-hidden="true"><use href="#i-x" /></svg>
      </button>
    </div>
    <form class="dlg-inner min-h-0 [padding:var(--ds-space-200)]" id="organization-session-form" novalidate>
      <div class="dbody flex flex-col gap-4 [padding:var(--ds-space-200)_var(--ds-space-200)] overflow-auto">
        <div class="rounded-md bg-[var(--line-2)] p-4" id="organization-session-target"></div>
        <aside
          role="note"
          class="flex items-start gap-3 rounded-md bg-[var(--danger-soft-bg)] p-3 text-ink">
          <svg
            width="16"
            height="16"
            aria-hidden="true"
            class="mt-0.5 flex-none text-[var(--danger)]">
            <use href="#i-warn" />
          </svg>
          <p class="m-0 text-xs leading-5" data-i18n="Ending this session interrupts its current work. The action and your reason will be recorded in the audit log.">
            Ending this session interrupts its current work. The action and your reason will be
            recorded in the audit log.
          </p>
        </aside>
        <label class="grid gap-1.5 text-body font-semibold" for="organization-session-reason"
          ><span><span data-i18n="Operational reason">Operational reason</span> <span class="font-normal text-muted" data-i18n="(required)">(required)</span></span>
          <textarea
            class="min-h-[82px] w-full resize-y rounded-md border border-line bg-surface px-2 py-2 font-[inherit] text-body text-ink"
            id="organization-session-reason"
            maxlength="160"
            required
            placeholder="Explain why this session must be ended" data-i18n-placeholder="Explain why this session must be ended"></textarea>
        </label>
        <span
          class="text-caption leading-[1.35] text-[var(--danger)] empty:hidden"
          id="organization-session-error"
          role="status"></span>
      </div>
      <div class="dfoot [padding:var(--ds-space-150)_var(--ds-space-200)] flex justify-end gap-2">
        <button type="button" class="lbtn out c-close" data-i18n="Cancel">Cancel</button
        ><button type="submit" class="lbtn pri" id="organization-session-confirm">
          Revoke session
        </button>
      </div>
    </form>
  </div>
</div>
