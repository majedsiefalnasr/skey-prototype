<template class="organization-tpl">
  <div
    class="organization-view [&:not([hidden])]:flex [&:not([hidden])]:flex-1 [&:not([hidden])]:min-h-0 [&:not([hidden])]:flex-col"
    data-settings-navigation-style="sidebar"
    hidden>
    <div class="phead [.d1_&]:[padding:11px_0] [.d1_&]:flex [.d1_&]:items-start [.d1_&]:gap-5 px-4">
      <div class="l [.d1_.phead_&]:flex-1">
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="#">Home</a><span class="sep">›</span
          ><span aria-current="page">Organization Center</span>
        </nav>
        <div
          class="tline [.d1_&]:flex [.d1_&]:items-center [.d1_&]:gap-3 [.d1_&]:mt-2! [.d1_&]:flex-wrap [.d1_&_h1]:[font-size:23px] [.d1_&_h1]:font-semibold">
          <h1>Organization Center</h1>
          <span class="badge gray" id="organization-role-badge">Administrator</span>
        </div>
      </div>
    </div>
    <div
      class="canvas organization-canvas flex-1 min-h-0 overflow-auto text-start"
      id="organization-canvas">
      <div
        class="organization-layout grid [grid-template-columns:minmax(190px,_245px)_minmax(0,_1fr)] gap-5 items-start [@media((max-width:720px))]:[grid-template-columns:minmax(0,_1fr)]">
        <div id="organization-nav-mount" class="contents"></div>
        <div class="organization-content min-w-0" id="organization-content"></div>
      </div>
    </div>
  </div>
</template>
