<template class="notifications-list-tpl">
  <div
    class="notifications-list-view flex-1 min-h-0 [&:not([hidden])]:flex [&:not([hidden])]:flex-col"
    hidden>
    <div class="phead [.d1_&]:[padding:var(--ds-space-150)_0] [.d1_&]:flex [.d1_&]:items-start [.d1_&]:gap-5 px-4">
      <div class="l [.d1_.phead_&]:[flex:1]">
        <nav class="crumbs [.d3_.otitle_&]:[margin-bottom:var(--ds-space-025)]!" aria-label="Breadcrumb">
          <a href="/" data-home-link data-i18n="Home">Home</a><span class="sep">›</span>
          <span aria-current="page" data-i18n="Notifications">Notifications</span>
        </nav>
        <div
          class="tline [.d1_&]:flex [.d1_&]:items-center [.d1_&]:gap-5 [.d1_&]:mt-2! [.d1_&]:flex-wrap [.d1_&_h1]:[font-size:23px] [.d1_&_h1]:font-semibold">
          <h1 data-i18n="Notifications">Notifications</h1>
        </div>
      </div>
    </div>
    <div class="canvas" id="notifications-list-canvas"></div>
    <div
      class="fnav fnav-list [.d4_&]:flex [.d4_&]:items-center [.d4_&]:gap-5 [.d4_&]:[padding:var(--ds-space-075)_var(--ds-space-200)] [.d4_&]:bg-surface [.d4_&]:[border-top:1px_solid_var(--line)]"
      id="notifications-list-fnav"></div>
  </div>
</template>

<!-- Same dialog shell as Display Journal Entry. Message notifications fill
     the summary only; alert notifications also mount a data-list in the canvas. -->
<div
  class="notification-modal fixed inset-0 z-[200] hidden [&:not(.hidden)]:flex items-center justify-center p-4 [background:var(--scrim)] backdrop-blur-[4px]"
  id="notification-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="notification-modal-title">
  <div
    class="dlg [width:min(600px,_96vw)] rounded-xl overflow-hidden flex flex-col [max-height:90vh] [&.wide]:[width:min(968px,_97vw)]"
    id="notification-modal-dlg"
    data-tone="info">
    <div class="dhd flex items-start gap-2 [&_h3]:[font-size:15px] [&_h3]:font-semibold">
      <svg class="size-[18px] flex-none text-accent" aria-hidden="true"><use id="notification-modal-icon" href="#i-bell" /></svg>
      <div class="min-w-0">
        <h3 id="notification-modal-title"></h3>
        <p class="dhd-subtitle" id="notification-modal-subtitle"></p>
      </div>
      <div id="notification-modal-actions" class="flex items-center gap-1.5" style="margin-inline-start: auto"></div>
      <button class="ibtn x" type="button" id="notification-modal-close" aria-label="Close">
        <svg width="15" height="15" aria-hidden="true"><use href="#i-x" /></svg>
      </button>
    </div>
    <div class="dlg-inner min-h-0 [padding:var(--ds-space-200)]">
      <div class="dbody overflow-auto">
        <div id="notification-modal-summary"></div>
        <div id="notification-modal-message" hidden></div>
        <div class="canvas [overflow:visible]! mt-0!" id="notification-detail-canvas" hidden></div>
        <div id="notification-modal-totals"></div>
        <div class="fnav fnav-list flex items-center gap-5 [padding:var(--ds-space-100)_0_0]" id="notification-detail-fnav" hidden></div>
      </div>
      <div class="dfoot flex items-center gap-2 [padding:var(--ds-space-200)_0_0]!">
        <span class="sum" id="notification-modal-note" style="font-size: 12px; color: var(--muted)"></span>
        <span class="end flex items-center gap-2" style="margin-inline-start: auto">
          <button class="lbtn out" type="button" id="notification-modal-close-btn" data-i18n="Close">Close</button>
        </span>
      </div>
    </div>
  </div>
</div>
