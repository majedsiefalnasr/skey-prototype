<!-- Collaboration overlays, shared by Notes, Activities, Events, People Data
     and Internal Mail: the side-panel editor, the Related Items picker and a
     small confirm dialog. Behavior lives in components/collab/panel.js and
     components/related-items/related-items.js. The editor follows the customer
     drawers' anatomy (title + description header, scrollable body, tinted
     footer) at the wider width an item editor needs. -->
<div id="collab-panel-scrim" class="fixed inset-0 z-[130] hidden [background:var(--scrim)] backdrop-blur-[4px] [&.open]:block"></div>
<aside
  id="collab-panel"
  class="fixed inset-y-0 end-0 z-[140] hidden w-[min(560px,94vw)] flex-col bg-surface shadow-shell [&.open]:flex"
  role="dialog"
  aria-modal="true"
  aria-labelledby="collab-panel-title"
  tabindex="-1">
  <header class="flex flex-none items-start gap-5 border-b border-line bg-[var(--line-2)] px-5 py-2.5">
    <div class="min-w-0 flex-1">
      <div class="flex min-w-0 flex-wrap items-center gap-x-2 gap-y-1">
        <h2 id="collab-panel-title" class="min-w-0 text-[16px] font-semibold [overflow-wrap:anywhere]" dir="auto"></h2>
        <span class="badge shrink-0" data-panel-status hidden></span>
      </div>
      <p class="mt-0.5 text-xs text-muted" data-panel-description hidden dir="auto"></p>
    </div>
    <div class="flex flex-none items-center gap-2">
      <button type="button" class="lbtn out" data-panel-edit hidden data-i18n="Edit">Edit</button>
      <div class="relative" data-panel-menu-wrap>
        <button type="button" class="ibtn" data-panel-menu aria-haspopup="menu" aria-expanded="false" aria-label="More actions">
          <svg width="15" height="15" aria-hidden="true"><use href="#i-dots" /></svg>
        </button>
        <div
          class="absolute end-0 top-full z-10 mt-1 hidden min-w-[190px] gap-0.5 rounded-lg border border-line bg-surface p-1.5 shadow-shell [&.open]:grid"
          role="menu"
          aria-label="More actions"
          data-panel-menu-list></div>
      </div>
      <button type="button" class="ibtn" data-panel-close aria-label="Close">
        <svg width="15" height="15" aria-hidden="true"><use href="#i-x" /></svg>
      </button>
    </div>
  </header>
  <form class="flex min-h-0 flex-1 flex-col" data-panel-form novalidate>
    <div class="min-h-0 flex-1 overflow-auto px-5 py-4">
      <div data-panel-body></div>
      <section class="mt-5 border-t border-line pt-4" data-panel-related aria-label="Related items"></section>
    </div>
    <footer class="flex flex-none items-center justify-end gap-2 border-t border-line bg-[var(--line-2)] px-5 py-3" data-panel-footer>
      <button type="button" class="lbtn out" data-panel-cancel data-i18n="Cancel">Cancel</button>
      <button type="submit" class="lbtn pri" data-panel-save data-i18n="Save">Save</button>
    </footer>
  </form>
</aside>
<div
  id="collab-picker"
  class="fixed inset-0 z-[150] hidden place-items-center [background:var(--scrim)] backdrop-blur-[4px] p-4 [&.open]:grid"
  role="dialog"
  aria-modal="true"
  aria-labelledby="collab-picker-title">
  <div class="flex max-h-[80vh] w-[min(560px,94vw)] flex-col rounded-lg bg-surface shadow-shell" data-picker-box>
    <div class="flex items-center gap-3 border-b border-line px-4 py-3">
      <h2 id="collab-picker-title" class="flex-1 text-[15px] font-semibold" data-i18n="Link existing item">Link existing item</h2>
    </div>
    <div class="px-4 pt-3">
      <input
        type="search"
        class="w-full rounded-md border border-line bg-surface px-2 py-1.5 text-ink"
        placeholder="Search notes, activities, events, mail, people…"
        aria-label="Search items"
        aria-controls="collab-picker-results"
        autocomplete="off"
        data-picker-search />
      <div class="mt-2 flex flex-wrap gap-1.5" role="group" aria-label="Filter by type" data-picker-types></div>
    </div>
    <ul id="collab-picker-results" class="m-0 min-h-[120px] flex-1 list-none overflow-auto p-2" role="listbox" aria-label="Results" data-picker-results></ul>
    <div class="flex items-center justify-between gap-3 border-t border-line px-4 py-3">
      <span class="text-xs text-muted" aria-live="polite" data-picker-status></span>
      <button type="button" class="lbtn pri" data-picker-done data-i18n="Done">Done</button>
    </div>
  </div>
</div>
<!-- Related records preview above the unchanged source record. -->
<div id="collab-preview" class="dscrim fixed inset-0 z-[155] hidden items-center justify-center bg-[var(--scrim)] p-6 backdrop-blur-[4px]">
  <div class="dlg flex max-h-[90vh] w-[min(520px,96vw)] flex-col overflow-hidden rounded-xl" data-tone="default" data-preview-box role="dialog" aria-modal="true" aria-labelledby="collab-preview-title" aria-describedby="collab-preview-meta" tabindex="-1">
    <div class="dhd flex items-start gap-5 [&_h3]:text-[15px]">
      <div class="min-w-0 flex-1">
        <h3 id="collab-preview-title" class="text-[15px] font-semibold [overflow-wrap:anywhere]" dir="auto"></h3>
        <p id="collab-preview-meta" class="dhd-subtitle"></p>
      </div>
      <button type="button" class="ibtn" data-preview-close aria-label="Close preview"><svg width="15" height="15" aria-hidden="true"><use href="#i-x" /></svg></button>
    </div>
    <div class="dlg-inner">
      <div class="dbody min-h-0 overflow-auto px-5 py-4 text-sm text-ink" data-preview-body></div>
      <div class="dfoot shrink-0 justify-end">
        <button type="button" class="lbtn out" data-preview-done data-i18n="Close">Close</button>
        <button type="button" class="lbtn pri" data-preview-full data-i18n="View full">View full</button>
      </div>
    </div>
  </div>
</div>
<!-- Confirm dialog: the app's shared popup shell (.dscrim > .dlg > .dhd +
     .dlg-inner > .dbody + .dfoot), the same one the invoice/customer status
     dialogs use — toned header, body copy, footer buttons right. -->
<div
  id="collab-confirm"
  class="dscrim fixed [inset:0] [background:var(--scrim)] backdrop-blur-[4px] [z-index:160] hidden items-center justify-center [padding:24px]"
  role="alertdialog"
  aria-modal="true"
  aria-labelledby="collab-confirm-title"
  aria-describedby="collab-confirm-body">
  <div
    class="dlg [width:min(440px,_96vw)] rounded-xl overflow-hidden flex flex-col [max-height:90vh]"
    data-tone="default"
    data-confirm-box>
    <div class="dhd flex items-start gap-2.5 [&_h3]:[font-size:15px] [&_h3]:font-semibold">
      <svg width="17" height="17" aria-hidden="true" class="[margin-top:2px]"><use href="#i-warn" /></svg>
      <h3 id="collab-confirm-title"></h3>
    </div>
    <div class="dlg-inner min-h-0 [padding:16px]">
      <div class="dbody text-sm [line-height:1.55] text-ink">
        <p id="collab-confirm-body"></p>
      </div>
      <div class="dfoot flex items-center gap-2.5 [padding:16px_0_0]!">
        <span class="end ms-auto flex gap-2">
          <button type="button" class="lbtn out" data-confirm-cancel data-i18n="Cancel">Cancel</button>
          <button type="button" class="lbtn pri" data-confirm-ok></button>
        </span>
      </div>
    </div>
  </div>
</div>
