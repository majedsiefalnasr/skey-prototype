    <!-- ===== customize sidebar dialog: build "For You" groups ===== -->
    <div class="dscrim" id="cscrim">
      <div class="dlg cs-dlg" role="dialog" aria-modal="true" aria-label="Customize your sidebar">
        <div class="dhd">
          <svg width="18" height="18" aria-hidden="true"><use href="#i-gear" /></svg>
          <div>
            <h3>Customize your sidebar</h3>
            <div class="sub">Changes apply only to you, not anyone else on this tenant</div>
          </div>
          <button class="ibtn c-close" aria-label="Close" style="margin-inline-start: auto">
            <svg width="15" height="15" aria-hidden="true"><use href="#i-x" /></svg>
          </button>
        </div>
        <div class="dbody cs-body">
          <p class="cs-intro">
            Drag a screen — or a whole app for all its screens — from the left into a group on the
            right to build your <b>For You</b> shortcut.
          </p>
          <div class="cs-cols">
            <div class="cs-col cs-col-tree">
              <div class="cs-col-hd">All apps &amp; screens</div>
              <ul class="cs-tree" id="cs-tree"></ul>
            </div>
            <div class="cs-col cs-col-groups">
              <div class="cs-col-hd">
                For You
                <button type="button" class="lbtn out sm" id="cs-add-group">+ Add group</button>
              </div>
              <ul class="cs-groups" id="cs-groups"></ul>
            </div>
          </div>
        </div>
        <div class="dfoot">
          <span class="sum" id="cs-count"></span>
          <span class="end">
            <button class="lbtn out c-close">Cancel</button>
            <button class="lbtn pri" id="cs-save">Save changes</button>
          </span>
        </div>
      </div>
    </div>
