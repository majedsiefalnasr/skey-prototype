    <!-- ===== keyboard shortcuts ===== -->
    <div class="dscrim fixed [inset:0] [background:rgba(17,_24,_39,_0.45)] [z-index:130] hidden items-center justify-center [padding:24px]" id="kscrim">
      <div class="kbdsheet" role="dialog" aria-modal="true" aria-labelledby="k-title">
        <div class="kh">
          <svg width="17" height="17" aria-hidden="true"><use href="#i-kbd" /></svg>
          <h3 id="k-title">Keyboard shortcuts</h3>
          <button class="ibtn k-close [.rec-adjustment-row_&]:[margin-bottom:1px]!" aria-label="Close" style="margin-inline-start: auto">
            <svg width="15" height="15" aria-hidden="true"><use href="#i-x" /></svg>
          </button>
        </div>
        <div class="kb">
          <dl>
            <dt>Search, or run an action on this invoice</dt>
            <dd><kbd>⌘</kbd> <kbd>K</kbd></dd>
            <dt>Save</dt>
            <dd><kbd>Ctrl</kbd> <kbd>S</kbd></dd>
            <dt>Start a new invoice</dt>
            <dd><kbd>Ctrl</kbd> <kbd>N</kbd></dd>
            <dt>Print</dt>
            <dd><kbd>Ctrl</kbd> <kbd>P</kbd></dd>
            <dt>Close what is open</dt>
            <dd><kbd>Esc</kbd></dd>
            <dt>This list</dt>
            <dd><kbd>F1</kbd></dd>
          </dl>
        </div>
      </div>
    </div>
