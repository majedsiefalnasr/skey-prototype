<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skey ERP — Sales Invoice List</title>
    <style>
      :root {
        /* Atlassian Design System tokens — atlassian.design (color.text, color.background.*, color.border, elevation, spacing) */
        --ink: #172b4d;
        --muted: #44546f;
        --faint: #7a869a;
        --line: #dcdfe4;
        --line-2: #f0f2f5;
        --bg: #f7f8f9;
        --surface: #fff;
        --accent: #0c66e4;
        --accent-soft: #e9f2ff;
        --accent-line: #cce0ff;
        --focus: #388bff;
        --danger: #ae2e24;
        --success: #216e4e;
        --st-open-bg: #e9f2ff;
        --st-open-ink: #0c66e4;
        --st-pend-bg: #fff7d6;
        --st-pend-ink: #974f0c;
        --st-post-bg: #dcfff1;
        --st-post-ink: #216e4e;
        --st-retn-bg: #ffecda;
        --st-retn-ink: #a54800;
        --st-canc-bg: #f1f2f4;
        --st-canc-ink: #44546f;
        --st-inac-bg: #eee5ff;
        --st-inac-ink: #5e4db2;
        --shadow-1: 0 1px 1px #091e4226, 0 0 1px #091e424f;
        --shadow-2: 0 8px 12px #091e4226, 0 0 1px #091e424f;
        --sidebar-w: 320px;
        --rail-w: 52px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font:
          14px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
      }

      /* ============ harness ============ */
      .demo-bar {
        position: sticky;
        top: 0;
        z-index: 200;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        background: #111827;
        color: #e5e7eb;
        padding: 10px 16px;
        font-size: 13px;
      }
      .demo-bar .grp {
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .demo-bar label {
        color: #9ca3af;
      }
      .demo-bar select {
        background: #1f2937;
        color: #e5e7eb;
        border: 1px solid #4b5563;
        border-radius: 6px;
        padding: 4px 7px;
      }
      .demo-bar .tab {
        padding: 5px 12px;
        border: 1px solid #4b5563;
        border-radius: 6px;
        color: #e5e7eb;
      }
      .demo-bar .tab[aria-pressed='true'] {
        background: #e5e7eb;
        color: #111827;
        border-color: #e5e7eb;
        font-weight: 600;
      }
      .demo-bar .sep {
        width: 1px;
        align-self: stretch;
        background: #374151;
      }

      /* ============ toasts ============ */
      .toastwrap {
        position: fixed;
        inset-block-end: 20px;
        inset-inline-start: 50%;
        translate: -50% 0;
        z-index: 300;
        display: flex;
        flex-direction: column;
        gap: 9px;
        align-items: center;
        pointer-events: none;
      }
      .toast {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-width: 320px;
        max-width: 520px;
        pointer-events: auto;
        background: #111827;
        color: #f4f6f9;
        border-radius: 10px;
        padding: 11px 14px;
        box-shadow: 0 10px 30px rgba(16, 24, 40, 0.28);
        font-size: 13px;
        animation: toastin 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @keyframes toastin {
        from {
          opacity: 0;
          translate: 0 8px;
        }
        to {
          opacity: 1;
          translate: 0 0;
        }
      }
      .toast .ic {
        margin-top: 1px;
      }
      .toast.ok .ic {
        color: #7ee2a1;
      }
      .toast.bad {
        background: #7c1d17;
      }
      .toast .bd {
        flex: 1;
      }
      .toast .bd b {
        display: block;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .toast .act {
        color: #cfe0ff;
        text-decoration: underline;
        background: none;
        font-size: 12.5px;
        margin-top: 5px;
        display: inline-block;
      }
      .toast .x {
        color: #cfd6e2;
        opacity: 0.8;
      }

      /* ---- floating control panel ---- */
      #kit {
        position: fixed;
        inset-block-end: 14px;
        inset-inline-start: 14px;
        z-index: 400;
        width: 322px;
        background: #111827;
        color: #e6e9ef;
        border: 1px solid #2b3446;
        border-radius: 12px;
        box-shadow: 0 18px 44px rgba(8, 12, 20, 0.42);
        font:
          13px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        overflow: hidden;
        user-select: none;
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 28px);
      }
      #kit .kit-h {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px 9px 12px;
        cursor: grab;
        background: #161e2c;
        border-bottom: 1px solid #2b3446;
      }
      #kit.dragging .kit-h {
        cursor: grabbing;
      }
      #kit .kit-h b {
        flex: 1;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #kit .kit-h .grip {
        color: #5c6779;
        letter-spacing: -2px;
        font-size: 15px;
        margin-inline-end: 2px;
      }
      #kit .kit-h button {
        background: none;
        border: none;
        color: #aab3c2;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        font-size: 12px;
      }
      #kit .kit-h button:hover {
        background: #232c3d;
        color: #fff;
      }
      #kit .kit-b {
        padding: 11px 12px 13px;
        display: flex;
        flex-direction: column;
        gap: 11px;
        flex: 1;
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
      }
      #kit.min .kit-b {
        display: none;
      }
      #kit .kit-b .grp {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
      }
      #kit .kit-b label {
        color: #98a2b3;
        font-size: 12.5px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      #kit .kit-b select {
        background: #1b2432;
        color: #e6e9ef;
        border: 1px solid #33405a;
        border-radius: 7px;
        padding: 5px 8px;
        font: inherit;
        max-width: 100%;
      }
      #kit .kit-b input[type='checkbox'] {
        accent-color: #6c9bff;
        width: 14px;
        height: 14px;
      }
      #kit .kit-b .tab,
      #kit .kit-b .open-btn,
      #kit .kit-b .mode-tab {
        background: #1b2432;
        border: 1px solid #33405a;
        color: #e6e9ef;
        border-radius: 7px;
        padding: 5px 10px;
        font: inherit;
        cursor: pointer;
      }
      #kit .kit-b .tab[aria-pressed='true'],
      #kit .kit-b .mode-tab[aria-pressed='true'] {
        background: #e8ebf1;
        color: #111827;
        border-color: #e8ebf1;
        font-weight: 600;
      }
      #kit .kit-b .sep {
        display: none;
      }
      #kit .kit-b hr {
        border: none;
        border-top: 1px solid #232c3d;
        margin: 1px 0;
      }

      #kit .kit-nav {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 9px 12px;
        background: #0d1420;
        border-bottom: 1px solid #232c3d;
      }
      #kit .kit-nav label {
        color: #8d97a8;
        font-size: 12px;
        white-space: nowrap;
      }
      #kit .kit-nav select {
        flex: 1 1 100%;
        min-width: 0;
        background: #1b2432;
        color: #e6e9ef;
        border: 1px solid #33405a;
        border-radius: 7px;
        padding: 5px 8px;
        font: inherit;
        text-overflow: ellipsis;
      }
      #kit .kit-nav a {
        color: #9db6ff;
        text-decoration: none;
        font-size: 12px;
        white-space: nowrap;
        padding: 4px 2px;
      }
      #kit .kit-nav a:hover {
        text-decoration: underline;
      }
      #kit.min .kit-nav {
        display: none;
      }
      #kit-pill {
        position: fixed;
        inset-block-end: 14px;
        inset-inline-start: 14px;
        z-index: 400;
        display: none;
        background: #111827;
        color: #e6e9ef;
        border: 1px solid #2b3446;
        border-radius: 999px;
        padding: 8px 14px;
        font:
          600 12.5px system-ui,
          sans-serif;
        cursor: pointer;
        box-shadow: 0 10px 26px rgba(8, 12, 20, 0.36);
      }
      #kit.hidden {
        display: none;
      }
      #kit.hidden ~ #kit-pill {
        display: inline-flex;
      }

      /* ---- notes dialog ---- */
      #kit-notes {
        position: fixed;
        inset: 0;
        z-index: 500;
        background: rgba(12, 17, 26, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      #kit-notes.open {
        display: flex;
      }
      #kit-notes .box {
        width: min(720px, 94vw);
        max-height: 86vh;
        background: #fff;
        color: #1b2230;
        border-radius: 14px;
        box-shadow: 0 26px 60px rgba(8, 12, 20, 0.34);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #kit-notes .nh {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 15px 18px;
        border-bottom: 1px solid #e4e7ec;
      }
      #kit-notes .nh h3 {
        margin: 0;
        font-size: 15.5px;
        font-weight: 620;
      }
      #kit-notes .nh button {
        margin-inline-start: auto;
        background: none;
        border: none;
        cursor: pointer;
        color: #5c6673;
        font-size: 18px;
        line-height: 1;
        padding: 4px 8px;
        border-radius: 6px;
      }
      #kit-notes .nh button:hover {
        background: #f1f3f6;
        color: #1b2230;
      }
      #kit-notes .nb {
        padding: 6px 20px 20px;
        overflow: auto;
      }
      #kit-notes .nb .n {
        font-size: 14.5px;
        line-height: 1.62;
        color: #4a5462;
        margin-top: 16px;
        max-width: 70ch;
      }
      #kit-notes .nb .n strong {
        color: #1b2230;
      }
      #kit-notes .nb .n em {
        color: #39424f;
      }

      #kit :is(button, select, input, a):focus-visible {
        outline: 2px solid #9db6ff;
        outline-offset: 2px;
        border-radius: 6px;
      }
      #kit-pill:focus-visible {
        outline: 2px solid #9db6ff;
        outline-offset: 2px;
      }
      #kit-notes :is(button, a):focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: 2px;
        border-radius: 6px;
      }
      @media (max-width: 720px) {
        #kit {
          inset-inline: 14px;
          width: auto;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #kit,
        #kit-notes {
          transition: none;
        }
      }

      /* ============ app-shell chrome (reproduced from concepts/app-shell.html) ============ */
      .frame {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: var(--surface);
      }
      .gtop {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 9px 16px 9px 8px;
        border-bottom: 1px solid var(--line);
      }
      .gtop .left {
        display: flex;
        align-items: center;
        gap: 10px;
        width: calc(var(--sidebar-w) - 16px);
        flex: none;
      }
      .gtop .left .app {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        padding: 6px 8px;
        border-radius: 8px;
        text-align: start;
      }
      .gtop .left .app:hover {
        background: #091e420f;
      }
      .gtop .left .app svg {
        flex: none;
      }
      .gtop .left .app .app-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .gtop .left .app:hover .tip {
        opacity: 1;
      }
      .gsearch {
        flex: 1;
        display: flex;
        justify-content: center;
        position: relative;
      }
      .swrap {
        position: relative;
        width: min(620px, 100%);
      }
      .swrap .sbox {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1.5px solid var(--line);
        border-radius: 8px;
        padding: 7px 12px;
        color: var(--muted);
        background: var(--surface);
        cursor: pointer;
        text-align: start;
      }
      .kbd-chip {
        font:
          11px ui-monospace,
          monospace;
        background: #eef1f6;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 6px;
        color: var(--muted);
        margin-inline-start: auto;
      }
      .spanel {
        position: fixed;
        z-index: 160;
        inset-inline: 0;
        margin-inline: auto;
        inset-block-start: 14px;
        width: min(620px, 92vw);
        background: var(--surface);
        border: 1.5px solid #dedede;
        border-radius: 9px;
        box-shadow: 0 18px 44px rgba(16, 24, 40, 0.24);
        overflow: hidden;
        display: none;
        flex-direction: column;
        max-height: min(600px, 68vh);
      }
      .spanel.open {
        display: flex;
      }
      .sinp {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }
      .sinp input {
        flex: 1;
        border: none;
        outline: none;
        font: 14px inherit;
      }
      .sctx {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background: #fafbfc;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
        flex-wrap: wrap;
      }
      .sctx b {
        color: var(--ink);
      }
      .sscope {
        display: inline-flex;
        gap: 4px;
        margin-inline-start: auto;
      }
      .sscope button {
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 10px;
        background: var(--surface);
        color: var(--muted);
      }
      .sscope button[aria-pressed='true'] {
        background: var(--accent-soft);
        border-color: var(--accent-line);
        color: var(--accent);
        font-weight: 600;
      }
      .sfoot {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 8px 14px;
        border-top: 1px solid var(--line);
        background: #fafbfc;
        font-size: 11px;
        color: var(--muted);
      }
      .sfoot .k {
        font:
          11px ui-monospace,
          monospace;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 6px;
        margin-inline-end: 5px;
      }
      .gtop .right {
        flex: none;
      }
      .right {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .right .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 11px;
      }
      .avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #c4b5fd;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 600;
        color: #4c1d95;
      }
      .ibtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-width: 32px;
        min-height: 32px;
        padding: 4px 8px;
        border-radius: 6px;
        position: relative;
      }
      .ibtn:hover:not(:disabled) {
        background: #eef1f6;
      }
      .lbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 11px;
        border-radius: 7px;
        border: 1px solid transparent;
        white-space: nowrap;
      }
      .lbtn:hover:not(:disabled) {
        background: #eef1f6;
      }
      .lbtn.pri {
        background: var(--accent);
        color: #fff;
      }
      .lbtn.pri:hover:not(:disabled) {
        background: #1741ad;
      }
      .lbtn.out {
        border-color: var(--line);
        background: var(--surface);
      }
      .tip {
        position: absolute;
        inset-block-start: calc(100% + 6px);
        inset-inline-start: 50%;
        translate: -50% 0;
        background: #111827;
        color: #f9fafb;
        font-size: 12px;
        padding: 3px 8px;
        border-radius: 4px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.12s;
        z-index: 40;
      }
      .ibtn:is(:hover, :focus-visible) .tip {
        opacity: 1;
      }
      .crumbs {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
      }
      .crumbs a {
        color: var(--accent);
        text-decoration: none;
      }
      .crumbs a:hover {
        text-decoration: underline;
      }
      .crumbs .sep {
        color: var(--faint);
      }
      .phead {
        padding: 11px 16px 0;
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .phead .l {
        flex: 1;
      }
      .phead .r {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
      }
      .tline {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 3px;
        flex-wrap: wrap;
      }
      .tline h1 {
        font-size: 18px;
      }
      .canvas {
        flex: 1;
        margin: 12px 16px;
      }

      /* menus (topbar dropdowns render closed by default; not wired up in this prototype) */
      .menu {
        position: relative;
      }
      .menu > button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 6px;
      }
      .menu > button:not(.main):not(.car):hover {
        background: #eef1f6;
      }
      .mlist {
        position: absolute;
        overflow: auto;
        inset-block-start: calc(100% + 4px);
        inset-inline-start: 0;
        z-index: 60;
        min-width: 232px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 4px;
        box-shadow: 0 8px 22px rgba(16, 24, 40, 0.13);
        display: none;
      }
      .mlist.open {
        display: block;
      }
      .mlist.mend {
        inset-inline-start: auto;
        inset-inline-end: 0;
      }
      .mlist button {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        text-align: start;
      }
      .mlist button:hover:not(:disabled) {
        background: #eef1f6;
      }
      .mlist hr {
        border: none;
        border-top: 1px solid var(--line);
        margin: 4px 6px;
      }
      .mlist .glbl {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--faint);
        padding: 6px 10px 2px;
      }
      .mlist button.dan {
        color: var(--danger);
      }

      /* ============ Sales Invoice List — Concept A (Data Grid) ============ */
      .inv-grid-wrap {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: auto;
      }
      .inv-grid {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .inv-grid th {
        text-align: start;
        padding: 8px 12px;
        background: var(--line-2);
        color: var(--muted);
        font-weight: 600;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      .inv-grid td {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line-2);
      }
      .inv-grid tbody tr:hover {
        background: var(--accent-soft);
        cursor: pointer;
      }
      .inv-grid-toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      .inv-grid-toolbar .grow {
        flex: 1;
      }
      .inv-group-bar {
        padding: 8px 12px;
        color: var(--faint);
        font-size: 12.5px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }

      /* ============ Badge ============ */
      .badge {
        font-size: 11px;
        font-weight: 600;
        border-radius: 5px;
        padding: 1px 7px;
      }
      .badge.ok {
        background: var(--st-post-bg);
        color: var(--st-post-ink);
      }
      .badge.gray {
        background: #eceef2;
        color: var(--muted);
      }
      .badge.fix {
        background: #e7f0ff;
        color: #12459e;
      }

      /* ============ Sales Invoice List — Concept B (Command List) ============ */
      .inv-cmd-search { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin-bottom: 10px; color: var(--faint); }
      .inv-cmd-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin-bottom: 6px; cursor: pointer; }
      .inv-cmd-row:hover { border-color: var(--accent-line); background: var(--accent-soft); }
      .inv-cmd-row .l { font-size: 13px; }
      .inv-cmd-row .r { font-size: 12.5px; color: var(--faint); }
      .inv-cmd-chips { display: flex; gap: 6px; margin-bottom: 10px; }

      /* ============ Sales Invoice List — Concept C (Grouped Review Board) ============ */
      .inv-board-group { margin-bottom: 16px; }
      .inv-board-group h3 { font-size: 13px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
      .inv-board-group h3 .dot { width: 8px; height: 8px; border-radius: 99px; display: inline-block; }
      .inv-board-card { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin-bottom: 6px; cursor: pointer; display: flex; justify-content: space-between; }
      .inv-board-card:hover { border-color: var(--accent-line); background: var(--accent-soft); }

      /* ============ Advanced search overlay (shared across list concepts) ============
     Same scrim + centered panel pattern as app-shell.html's own .sscrim/.spanel search,
     adapted with invoice-relevant example filters instead of the whole-app command palette.
     Scoped under #adv-search-scrim so it never collides with the decorative, inert
     .swrap/.spanel search box reproduced in the topbar above. */
      #adv-search-scrim {
        position: fixed;
        inset: 0;
        background: transparent;
        z-index: 150;
        display: none;
      }
      #adv-search-scrim.open {
        display: block;
      }
      #adv-search-scrim .box {
        position: fixed;
        z-index: 160;
        inset-inline: 0;
        margin-inline: auto;
        inset-block-start: 14px;
        width: min(620px, 92vw);
        background: var(--surface);
        border: 1.5px solid #dedede;
        border-radius: 9px;
        box-shadow: 0 18px 44px rgba(16, 24, 40, 0.24);
        overflow: hidden;
        display: none;
        flex-direction: column;
        max-height: min(600px, 68vh);
      }
      #adv-search-scrim.open .box {
        display: flex;
      }
      #adv-search-scrim .as-inp {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }
      #adv-search-scrim .as-inp input {
        flex: 1;
        border: none;
        outline: none;
        font: 14px inherit;
      }
      #adv-search-scrim .as-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        background: #fafbfc;
      }
      #adv-search-scrim .as-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #adv-search-scrim .as-field label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--faint);
      }
      #adv-search-scrim .as-field input,
      #adv-search-scrim .as-field select {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
        font: 13px inherit;
        color: var(--ink);
        background: var(--surface);
      }
      #adv-search-scrim .as-list {
        flex: 1;
        overflow: auto;
        padding: 6px;
      }
      #adv-search-scrim .as-grp {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--faint);
        padding: 9px 12px 3px;
      }
      #adv-search-scrim .as-item {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 11px;
        padding: 8px 12px;
        border-radius: 8px;
        text-align: start;
      }
      #adv-search-scrim .as-item:hover {
        background: var(--accent-soft);
      }
      #adv-search-scrim .as-item .ic {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: #eef1f6;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        flex: none;
      }
      #adv-search-scrim .as-item:hover .ic {
        background: var(--surface);
        color: var(--accent);
      }
      #adv-search-scrim .as-item .tx {
        flex: 1;
        min-width: 0;
      }
      #adv-search-scrim .as-item .t {
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #adv-search-scrim .as-item .s {
        font-size: 11px;
        color: var(--muted);
        margin-top: 1px;
      }
      #adv-search-scrim .as-foot {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 8px 14px;
        border-top: 1px solid var(--line);
        background: #fafbfc;
        font-size: 11px;
        color: var(--muted);
      }
      #adv-search-scrim .as-foot .k {
        font:
          11px ui-monospace,
          monospace;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 6px;
        margin-inline-end: 5px;
      }
      #adv-search-scrim .adv-search-close {
        margin-inline-start: auto;
      }
    </style>
  </head>
  <body>
    <div class="demo-bar">
      <div class="grp">
        <label for="list-concept">List concept:</label>
        <select id="list-concept" autocomplete="off">
          <option value="a" selected>A · Data Grid</option>
          <option value="b">B · Command List</option>
          <option value="c">C · Grouped Review Board</option>
        </select>
      </div>
    </div>
    <div class="toastwrap" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

    <!-- ===== advanced search overlay (shared across list concepts A/B/C) =====
     Adapted from app-shell.html's own .sscrim/.spanel search: same scrim + centered
     panel + input + results-list structure, filled with invoice-relevant example
     filters (Doc No., Customer, Date range, Status, Payment method) instead of the
     whole-app command palette. Filter rows are static example content, not a working
     filter system. -->
    <div id="adv-search-scrim">
      <div class="box" role="dialog" aria-label="Advanced search" aria-modal="true">
        <div class="as-inp">
          <svg width="15" height="15" aria-hidden="true"><use href="#i-search" /></svg>
          <input
            type="text"
            placeholder="Search by document number, customer, or amount"
            autocomplete="off" />
          <span class="kbd-chip" style="margin: 0">Esc</span>
        </div>
        <div class="as-fields">
          <div class="as-field">
            <label for="as-docno">Doc No.</label>
            <input id="as-docno" type="text" placeholder="e.g. 126" />
          </div>
          <div class="as-field">
            <label for="as-customer">Customer</label>
            <input id="as-customer" type="text" placeholder="Customer name or number" />
          </div>
          <div class="as-field">
            <label for="as-date">Date range</label>
            <input id="as-date" type="text" placeholder="e.g. 01/08/2026 – 13/08/2026" />
          </div>
          <div class="as-field">
            <label for="as-status">Status</label>
            <select id="as-status">
              <option>All statuses</option>
              <option>Posted</option>
              <option>Pending</option>
              <option>Open</option>
            </select>
          </div>
          <div class="as-field">
            <label for="as-pay">Payment method</label>
            <select id="as-pay">
              <option>All methods</option>
              <option>Cash</option>
              <option>Credit</option>
            </select>
          </div>
        </div>
        <div class="as-list" role="listbox">
          <div class="as-grp">Matching invoices</div>
          <button type="button" class="as-item" role="option">
            <span class="ic"><svg width="14" height="14" aria-hidden="true"><use href="#i-doc" /></svg></span>
            <span class="tx"><span class="t">#126 · محمد احمد</span><span class="s">13/08/2026 · Credit</span></span>
          </button>
          <button type="button" class="as-item" role="option">
            <span class="ic"><svg width="14" height="14" aria-hidden="true"><use href="#i-doc" /></svg></span>
            <span class="tx"><span class="t">#140 · العميل الاول</span><span class="s">13/08/2026 · Credit</span></span>
          </button>
        </div>
        <div class="as-foot">
          <span><span class="k">↑↓</span>Navigate</span><span><span class="k">↵</span>Open</span>
          <button type="button" class="lbtn out adv-search-close" style="margin-inline-start: auto">
            Close
          </button>
        </div>
      </div>
    </div>

    <script>
      /* ================= shell services: focus, toasts, async work =================
   Everything that takes time has three visible states — working, done, failed —
   and every overlay gives the keyboard back where it found it.                */

      /* ---- focus: trap inside an open overlay, restore it on close ---- */
      let focusReturn = null,
        trapped = null
      const FOCUSABLE =
        'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])'
      const trapFocus = box => {
        if (!box) return
        focusReturn = document.activeElement
        trapped = box
        const first = box.querySelector(FOCUSABLE)
        ;(first || box).focus?.()
      }
      const releaseFocus = () => {
        trapped = null
        if (focusReturn && document.contains(focusReturn)) focusReturn.focus()
        focusReturn = null
      }
      document.addEventListener(
        'keydown',
        e => {
          if (e.key !== 'Tab' || !trapped) return
          const items = [...trapped.querySelectorAll(FOCUSABLE)].filter(
            el => el.offsetParent !== null
          )
          if (!items.length) return
          const first = items[0],
            last = items[items.length - 1]
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault()
            last.focus()
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault()
            first.focus()
          }
        },
        true
      )

      /* ---- toasts: say what happened, and offer the next step ---- */
      const toasts = document.getElementById('toasts')
      const toast = ({tone = 'ok', title, body, action, onAction, ms = 5200}) => {
        const t = document.createElement('div')
        t.className = 'toast ' + tone
        t.innerHTML = `<span class="ic"><svg width="16" height="16"><use href="#${tone === 'ok' ? 'i-check' : 'i-warn'}"/></svg></span>
    <span class="bd"><b>${title}</b>${body ? body : ''}${action ? `<button class="act">${action}</button>` : ''}</span>
    <button class="ibtn x" aria-label="Dismiss"><svg width="13" height="13"><use href="#i-x"/></svg></button>`
        t.querySelector('.x').onclick = () => t.remove()
        if (action)
          t.querySelector('.act').onclick = () => {
            t.remove()
            onAction && onAction()
          }
        toasts.append(t)
        setTimeout(() => t.remove(), ms)
      }

      /* ---- advanced search: shared overlay opened from every list concept's Search trigger ---- */
      const advSearchScrim = document.getElementById('adv-search-scrim')
      function openAdvancedSearch() {
        advSearchScrim.classList.add('open')
        trapFocus(advSearchScrim.querySelector('.box'))
      }
      function closeAdvancedSearch() {
        advSearchScrim.classList.remove('open')
        releaseFocus()
      }
      advSearchScrim.addEventListener('click', e => {
        if (e.target === advSearchScrim || e.target.closest('.adv-search-close')) closeAdvancedSearch()
      })
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && advSearchScrim.classList.contains('open')) closeAdvancedSearch()
      })
    </script>

    <script id="shell-kit-js">
      ;(() => {
        const bar = document.querySelector('.demo-bar')
        if (!bar) return

        /* ---------- 1. move the harness into a floating panel ---------- */
        const kit = document.createElement('div')
        kit.id = 'kit'
        kit.setAttribute('role', 'region')
        kit.setAttribute('aria-label', 'Prototype controls')
        kit.innerHTML =
          '<div class="kit-h"><span class="grip">\u22ee\u22ee</span><b>Prototype controls</b>' +
          '<button type="button" id="kit-info" title="About this prototype" aria-label="About this prototype">\u24d8 About</button>' +
          '<button type="button" id="kit-min" title="Collapse" aria-label="Collapse">\u2013</button>' +
          '<button type="button" id="kit-hide" title="Hide" aria-label="Hide">\u00d7</button></div>' +
          '<div class="kit-nav"><span style="flex:1 1 100%">Skey ERP \u00b7 App Shell</span><a href="../index.html" title="Project overview">Index</a></div>' +
          '<div class="kit-b"></div>'
        const body = kit.querySelector('.kit-b')
        ;[...bar.children].forEach(child => {
          if (child.classList.contains('sep')) {
            body.appendChild(document.createElement('hr'))
            return
          }
          body.appendChild(child)
        })
        bar.remove()
        document.body.appendChild(kit)

        const pill = document.createElement('button')
        pill.id = 'kit-pill'
        pill.className = 'kit-pill'
        pill.type = 'button'
        pill.textContent = 'Prototype controls'
        document.body.appendChild(pill)
        /* ---------- shared prototype state, so switching versions keeps your setup ---------- */
        const STATE_KEY = 'skey-proto-state'
        const UI_KEY = 'skey-proto-ui'
        const readJSON = (k, fallback) => {
          try {
            return Object.assign({}, fallback, JSON.parse(sessionStorage.getItem(k) || '{}'))
          } catch {
            return Object.assign({}, fallback)
          }
        }
        const writeJSON = (k, v) => {
          try {
            sessionStorage.setItem(k, JSON.stringify(v))
          } catch {}
        }

        /* every harness control, addressed by id, restored and persisted by value */
        const CONTROL_IDS = [
          'mode',
          'st',
          'pay',
          'dirty',
          'failsim',
          'emptyflow',
          'rtl',
          'density',
          'lang',
        ]

        const captureState = () => {
          const s = {}
          for (const id of CONTROL_IDS) {
            const el = document.getElementById(id)
            if (!el) continue
            s[id] = el.type === 'checkbox' ? el.checked : el.value
          }
          const active = kit.querySelector(
            '.kit-b button.tab.on, .kit-b button.tab[aria-pressed="true"]'
          )
          if (active) s.layout = active.textContent.trim()
          return s
        }

        /* apply saved values, then fire the events the prototype already listens for */
        const restoreState = () => {
          const saved = readJSON(STATE_KEY, null)
          if (!saved || !Object.keys(saved).length) return
          for (const id of CONTROL_IDS) {
            const el = document.getElementById(id)
            if (!el || !(id in saved)) continue
            const want = saved[id]
            if (el.type === 'checkbox') {
              if (el.checked !== want) {
                el.checked = want
                el.dispatchEvent(new Event('change', {bubbles: true}))
              }
            } else if ([...(el.options || [])].some(o => o.value === want)) {
              if (el.value !== want) {
                el.value = want
                el.dispatchEvent(new Event('change', {bubbles: true}))
              }
            }
          }
          if (saved.layout) {
            const btn = [...kit.querySelectorAll('.kit-b button.tab')].find(
              b => b.textContent.trim() === saved.layout
            )
            if (btn && btn.getAttribute('aria-pressed') !== 'true') btn.click()
          }
        }

        restoreState()
        kit.addEventListener('change', () => writeJSON(STATE_KEY, captureState()))
        kit.addEventListener('click', e => {
          if (e.target.closest('.kit-b button.tab'))
            setTimeout(() => writeJSON(STATE_KEY, captureState()), 0)
        })

        /* ---------- panel chrome: collapse, hide, drag, all remembered ---------- */
        const ui = readJSON(UI_KEY, {min: false, hidden: false, left: null, top: null})
        const minBtn = document.getElementById('kit-min')
        const saveUI = () => writeJSON(UI_KEY, ui)

        const applyMin = () => {
          kit.classList.toggle('min', ui.min)
          minBtn.textContent = ui.min ? '\u25a1' : '\u2013'
          minBtn.title = minBtn.ariaLabel = ui.min ? 'Expand' : 'Collapse'
          minBtn.setAttribute('aria-expanded', String(!ui.min))
        }
        const applyHidden = () => {
          kit.classList.toggle('hidden', ui.hidden)
          kit.setAttribute('aria-hidden', String(ui.hidden))
          pill.setAttribute('aria-expanded', String(!ui.hidden))
        }

        minBtn.onclick = () => {
          ui.min = !ui.min
          applyMin()
          saveUI()
        }
        document.getElementById('kit-hide').onclick = () => {
          ui.hidden = true
          applyHidden()
          saveUI()
          pill.focus()
        }
        pill.onclick = () => {
          ui.hidden = false
          applyHidden()
          saveUI()
          minBtn.focus()
        }
        applyMin()
        applyHidden()

        /* keep the panel fully on screen; used after drags and on resize */
        const clamp = () => {
          if (ui.left == null || ui.top == null) return
          const w = kit.offsetWidth,
            h = kit.offsetHeight
          ui.left = Math.min(Math.max(6, ui.left), Math.max(6, innerWidth - w - 6))
          ui.top = Math.min(Math.max(6, ui.top), Math.max(6, innerHeight - h - 6))
          kit.style.inset = 'auto'
          kit.style.left = ui.left + 'px'
          kit.style.top = ui.top + 'px'
        }
        clamp()
        addEventListener('resize', clamp)

        const head = kit.querySelector('.kit-h')
        let sx = 0,
          sy = 0,
          ox = 0,
          oy = 0,
          dragging = false
        head.addEventListener('pointerdown', e => {
          if (e.target.closest('button')) return
          const r = kit.getBoundingClientRect()
          kit.style.inset = 'auto'
          kit.style.left = r.left + 'px'
          kit.style.top = r.top + 'px'
          sx = e.clientX
          sy = e.clientY
          ox = r.left
          oy = r.top
          dragging = true
          kit.classList.add('dragging')
          head.setPointerCapture(e.pointerId)
        })
        head.addEventListener('pointermove', e => {
          if (!dragging) return
          const w = kit.offsetWidth,
            h = kit.offsetHeight
          ui.left = Math.min(Math.max(6, ox + e.clientX - sx), innerWidth - w - 6)
          ui.top = Math.min(Math.max(6, oy + e.clientY - sy), innerHeight - h - 6)
          kit.style.left = ui.left + 'px'
          kit.style.top = ui.top + 'px'
        })
        const endDrag = e => {
          if (!dragging) return
          dragging = false
          kit.classList.remove('dragging')
          try {
            head.releasePointerCapture(e.pointerId)
          } catch {}
          saveUI()
        }
        head.addEventListener('pointerup', endDrag)
        head.addEventListener('pointercancel', endDrag)

        /* double-click the header to snap back to the default corner */
        head.addEventListener('dblclick', e => {
          if (e.target.closest('button')) return
          ui.left = ui.top = null
          saveUI()
          kit.style.inset = ''
          kit.style.left = ''
          kit.style.top = ''
        })

        /* ---------- 2. the written notes become a dialog ---------- */
        const notes = [...document.querySelectorAll('.note, .concept-note')].map(n => {
          const section = n.closest('.design, .concept')
          return {
            html: n.outerHTML.replace(/class="[^"]*"/, 'class="n"'),
            key: section ? section.dataset.design || section.dataset.concept || '' : '',
          }
        })
        document.querySelectorAll('.note, .concept-note').forEach(n => n.remove())

        const dlg = document.createElement('div')
        dlg.id = 'kit-notes'
        dlg.innerHTML =
          '<div class="box" role="dialog" aria-modal="true" aria-labelledby="kit-notes-t">' +
          '<div class="nh"><h3 id="kit-notes-t">About this prototype</h3>' +
          '<button type="button" aria-label="Close">\u00d7</button></div><div class="nb"></div></div>'
        document.body.appendChild(dlg)
        const nb = dlg.querySelector('.nb')
        const box = dlg.querySelector('.box')
        const infoBtn = document.getElementById('kit-info')
        let lastFocus = null

        const closeNotes = () => {
          if (!dlg.classList.contains('open')) return
          dlg.classList.remove('open')
          infoBtn.setAttribute('aria-expanded', 'false')
          ;(lastFocus || infoBtn).focus()
        }
        dlg.querySelector('.nh button').onclick = closeNotes
        dlg.addEventListener('click', e => {
          if (e.target === dlg) closeNotes()
        })

        /* Escape closes, Tab stays inside the dialog while it is open */
        document.addEventListener('keydown', e => {
          if (!dlg.classList.contains('open')) return
          if (e.key === 'Escape') {
            e.preventDefault()
            closeNotes()
            return
          }
          if (e.key !== 'Tab') return
          const f = [
            ...box.querySelectorAll(
              'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
            ),
          ].filter(el => el.offsetParent !== null)
          if (!f.length) return
          const first = f[0],
            last = f[f.length - 1]
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault()
            last.focus()
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault()
            first.focus()
          }
        })

        const activeKey = () => {
          const a = document.querySelector('.design.active, .concept.active')
          return a ? a.dataset.design || a.dataset.concept || '' : ''
        }
        infoBtn.setAttribute('aria-expanded', 'false')
        infoBtn.onclick = () => {
          const k = activeKey()
          const shown = notes.filter(n => !n.key || n.key === k)
          nb.innerHTML = (shown.length ? shown : notes).map(n => n.html).join('')
          lastFocus = document.activeElement
          dlg.classList.add('open')
          infoBtn.setAttribute('aria-expanded', 'true')
          nb.scrollTop = 0
          dlg.querySelector('.nh button').focus()
        }
      })()
    </script>

          '<div class="inv-grid-wrap">' +
          '<div class="inv-grid-toolbar">' +
          '<button class="lbtn out" type="button" onclick="openAdvancedSearch()">' +
          '<svg width="15" height="15" aria-hidden="true"><use href="#i-search"/></svg> Search</button>' +
          '<div class="grow"></div>' +
          '<button class="lbtn out" type="button" onclick="toast({tone:\'ok\',title:\'Columns menu is out of scope here\'})">Columns</button>' +
          '<button class="lbtn out" type="button" onclick="toast({tone:\'ok\',title:\'Export is out of scope here\'})">Export</button>' +
          '</div>' +
          '<div class="inv-group-bar">Drag a column header here to group</div>' +
          '<table class="inv-grid"><thead><tr>' +
          LIST_COLUMNS.map(c => `<th>${c}</th>`).join('') +
          '</tr></thead><tbody>' +
          LIST_ROWS.map(
            r =>
              `<tr onclick="openInvoiceRecord('${r.no}')">` +
              `<td>${r.seq}</td><td>${r.no}</td><td>${r.date}</td><td>${r.subtype}</td>` +
              `<td>${r.pay}</td><td>${r.custNo}</td><td>${r.custName}</td></tr>`
          ).join('') +
          '</tbody></table>' +
          '</div>'
      }

      function renderListB(canvas) {
        canvas.innerHTML =
          '<button type="button" class="inv-cmd-search" onclick="openAdvancedSearch()" style="width:100%;text-align:start;border:1px solid var(--line);cursor:pointer">' +
            '<svg width="15" height="15" aria-hidden="true"><use href="#i-search"/></svg> Search or jump to invoice #…' +
          '</button>' +
          '<div class="inv-cmd-chips">' +
            '<span class="badge gray">All statuses</span><span class="badge gray">All customers</span>' +
          '</div>' +
          LIST_ROWS.map(r =>
            `<div class="inv-cmd-row" onclick="openInvoiceRecord('${r.no}')">` +
            `<span class="l"><b>#${r.no}</b> · ${r.custName} · ${r.pay}</span>` +
            `<span class="r">${r.date}</span></div>`
          ).join('')
      }

      const STATUS_META = {
        posted: {label: 'Posted', color: 'var(--st-post-ink)'},
        pending: {label: 'Pending', color: 'var(--st-pend-ink)'},
        open: {label: 'Open', color: 'var(--st-open-ink)'},
      }
      function renderListC(canvas) {
        const groups = {posted: LIST_ROWS.slice(0, 2), pending: LIST_ROWS.slice(2)}
        canvas.innerHTML = Object.entries(groups).map(([key, rows]) => {
          if (!rows.length) return ''
          const meta = STATUS_META[key]
          return `<div class="inv-board-group"><h3><span class="dot" style="background:${meta.color}"></span>${meta.label} (${rows.length})</h3>` +
            rows.map(r =>
              `<div class="inv-board-card" onclick="openInvoiceRecord('${r.no}')">` +
              `<span><b>#${r.no}</b> · ${r.custName}</span><span>${r.pay} · ${r.date}</span></div>`
            ).join('') + '</div>'
        }).join('')
      }

      function openInvoiceRecord(no) {
        toast({tone: 'ok', title: `Opens invoice ${no}`, body: 'See sales-invoice-record.html'})
      }

      function renderList(concept) {
        const canvas = document.getElementById('list-canvas')
        if (concept === 'a') renderListA(canvas)
        else if (concept === 'b') renderListB(canvas)
        else if (concept === 'c') renderListC(canvas)
      }

      document.getElementById('list-concept').addEventListener('change', e => renderList(e.target.value))
      renderList('a')
    </script>
  </body>
</html>
